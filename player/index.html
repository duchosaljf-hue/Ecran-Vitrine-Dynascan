<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitrine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div class="layer" id="layerA"></div>
    <div class="layer" id="layerB"></div>
  </div>

  <div id="empty" hidden>
    <div class="empty-title">Vitrine</div>
    <div class="empty-text">Aucun contenu à afficher</div>
  </div>

  <div id="widget" hidden>
    <div id="clock">--:--</div>
    <div id="date"></div>
    <div id="weather"></div>
  </div>

  <div id="ticker" hidden><div id="tickerText"></div></div>

  <script src="player.js"></script>
</body>
</html>
